# The way this works is the following:
#
# The get-release job fetches the upload_url for the following job.
#
# The build-release job runs only once create-release is finished. It gets the
# release upload URL from create-release job outputs, then builds the release
# executables for each supported platform and attaches them as release assets
# to the previously created release.

name: Release
env:
  CICD_INTERMEDIATES_DIR: "_cicd-intermediates"
  MSRV_FEATURES: --no-default-features --features minimal-application,bugreport,build-assets

on:
  push:
    # Enable when testing release infrastructure on a branch.
    # branches:
    # - fix/release-ci-after-voice
    tags:
    - "[0-9]+.[0-9]+.[0-9]+"
    - "[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"
jobs:
  get-release:
    name: Get Release Tag
    runs-on: ubuntu-latest
    outputs:
      smartcat_version: ${{ steps.extract_version.outputs.smartcat_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract tag as version
        id: extract_version
        run: echo "smartcat_version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: get-release
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ needs.get-release.outputs.smartcat_version }} \
            --title "Release ${{ needs.get-release.outputs.smartcat_version }}" \
            --notes "Automated release from CI"

  build-release:
      name: ${{ matrix.job.target }} (${{ matrix.job.os }})
      runs-on: ${{ matrix.job.os }}
      needs:
        - get-release
      strategy:
        fail-fast: false
        matrix:
          job:
            # - { target: aarch64-unknown-linux-gnu   , os: ubuntu-latest }
            # - { target: arm-unknown-linux-gnueabihf , os: ubuntu-latest }
            # - { target: arm-unknown-linux-musleabihf, os: ubuntu-latest }
            # - { target: i686-pc-windows-msvc        , os: windows-latest }
            # - { target: i686-unknown-linux-gnu      , os: ubuntu-latest }
            # - { target: i686-unknown-linux-musl     , os: ubuntu-latest }
            # - { target: x86_64-apple-darwin         , os: macos-12     }
            # - { target: x86_64-pc-windows-gnu       , os: windows-latest }
            # - { target: x86_64-pc-windows-msvc      , os: windows-latest }
            - { target: x86_64-unknown-linux-gnu    , os: ubuntu-latest }
            # - { target: x86_64-unknown-linux-musl   , os: ubuntu-latest }
      env:
        BUILD_CMD: cargo
      steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install prerequisites
        shell: bash
        run: |
          case ${{ matrix.job.target }} in
            arm-unknown-linux-*) sudo apt-get -y update ; sudo apt-get -y install gcc-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu) sudo apt-get -y update ; sudo apt-get -y install gcc-aarch64-linux-gnu ;;
          esac

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Show version information (Rust, cargo, GCC)
        shell: bash
        run: |
          gcc --version || true
          rustup -V
          rustup toolchain list
          rustup default
          cargo -V
          rustc -V

      - name: Build
        shell: bash
        run: $BUILD_CMD build --release --target=${{ matrix.job.target }}

      - name: Set binary name & path
        id: bin
        shell: bash
        run: |
          # Figure out suffix of binary
          EXE_SUFFIX=""
          case ${{ matrix.job.target }} in
            *-pc-windows-*) EXE_SUFFIX=".exe" ;;
          esac;

          # Setup paths
          BIN_NAME="sc${EXE_SUFFIX}"
          BIN_PATH="target/${{ matrix.job.target }}/release/${BIN_NAME}"

          # Let subsequent steps know where to find the binary
          echo "BIN_PATH=${BIN_PATH}" | tee -a $GITHUB_OUTPUT
          echo "BIN_NAME=${BIN_NAME}" | tee -a $GITHUB_OUTPUT

      - name: Build archive
        id: package
        shell: bash
        run: |
          PKG_SUFFIX=".tar.gz" ; case ${{ matrix.job.target }} in *-pc-windows-*) PKG_SUFFIX=".zip" ;; esac;
          PKG_BASENAME="sc-${{ needs.crate-metadata.outputs.version }}-${{ matrix.job.target }}"
          PKG_NAME=${PKG_BASENAME}${PKG_SUFFIX}
          echo "PKG_NAME=${PKG_NAME}" | tee -a $GITHUB_OUTPUT

          PKG_STAGING="${{ env.CICD_INTERMEDIATES_DIR }}/package"
          ARCHIVE_DIR="${PKG_STAGING}/${PKG_BASENAME}/"
          mkdir -p "${ARCHIVE_DIR}"

          # Binary
          cp "${{ steps.bin.outputs.BIN_PATH }}" "$ARCHIVE_DIR"

          # README, LICENSE and CHANGELOG files
          cp "README.md" "LICENSE" "$ARCHIVE_DIR"

          # base compressed package
          pushd "${PKG_STAGING}/" >/dev/null
          case ${{ matrix.job.target }} in
            *-pc-windows-*) 7z -y a "${PKG_NAME}" "${PKG_BASENAME}"/* | tail -2 ;;
            *) tar czf "${PKG_NAME}" "${PKG_BASENAME}"/* ;;
          esac;
          popd >/dev/null

          # sha
          pushd "${PKG_STAGING}/" >/dev/null
          case ${{ matrix.job.target }} in
            *-pc-windows-*) certutil -hashfile "${PKG_NAME}" SHA256 > "${PKG_NAME}.sha256" ;;
            *) shasum -a 256 "${PKG_NAME}" > "${PKG_NAME}.sha256" ;;
          esac;
          popd >/dev/null

          # Let subsequent steps know where to find the compressed package
          echo "ASSET_PATH=${PKG_STAGING}/${PKG_NAME}" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=${PKG_STAGING}/${PKG_NAME}.sha256" | tee -a $GITHUB_ENV

      - name: Upload release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ needs.get-release.outputs.smartcat_version }} ${{ env.ASSET_PATH }} ${{ env.ASSET_SUM }}

  docker-release:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [get-release, build-release]
    permissions:
      contents: read
      packages: write  # For GHCR
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Download release asset from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p docker-binary
          gh release download ${{ needs.get-release.outputs.smartcat_version }} \
            --pattern "sc--x86_64-unknown-linux-gnu.tar.gz" \
            --dir docker-binary
          echo "list docker binary dir after extraction"
          tar -xzf docker-binary/sc--x86_64-unknown-linux-gnu.tar.gz -C docker-binary --strip-components=1
          chmod +x docker-binary/sc

      - name: Create Dockerfile
        run: |
          cat <<EOF > docker-binary/Dockerfile
          FROM debian:bookworm-slim
          COPY sc /usr/local/bin/sc
          ENTRYPOINT ["sc"]
          EOF

      - name: Build and push Docker image (multi-arch)
        uses: docker/build-push-action@v5
        with:
          context: docker-binary
          file: docker-binary/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/sc:latest
            ghcr.io/${{ github.repository_owner }}/sc:${{ needs.get-release.outputs.smartcat_version }}

